# ─── Nav2 params for RoboDojo autonomous maze navigation ───
# Frame tree:  map -> odom (AMCL) -> base_footprint (EKF) -> base_link -> lidar_link / imu_link
# Localization: AMCL scan matching against a saved map, with EKF (IMU + wheel odom) providing odom.
# Every robot base frame below is base_footprint.

amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"
    scan_topic: scan
    map_topic: map
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: 0.1
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # FIX: full plugin class name required by newer Nav2
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.05
    z_hit: 0.95
    z_max: 0.05
    z_rand: 0.05
    z_short: 0.05
    # FIX: AMCL does not publish map->odom until it has an initial pose.
    # These values must match where the robot spawns, in MAP coordinates.
    # Spawn is x=-2.50, y=-1.10 in the world. Aligning maps/arena.pgm against
    # the arena walls mesh gives map = world + (2.70, 1.30) (rotation 0, 100% of
    # the map's wall cells within 10 cm of a real wall), so the spawn is
    # map (0.20, 0.20). Change both together if you move the spawn.
    set_initial_pose: true
    always_reset_initial_pose: false
    first_map_only: false
    initial_pose:
      x: 0.20
      y: 0.20
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    # FIX: was base_link
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.2
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # FIX: removed the manual plugin_lib_names list and the empty default BT xml
    # strings. Nav2 loads its default BT plugins and default trees on its own.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    # FIX: was 0.5 (typo). Diff drive has no y velocity.
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: "odom"
    # The Gazebo bridge expects plain Twist, not TwistStamped
    enable_stamped_cmd_vel: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # Tight squeezes and ramp climbing are slow; 0.3 m in 10 s aborted the
      # goal mid-manoeuvre and dropped the robot into a recovery/spin loop.
      required_movement_radius: 0.08
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      # 0.20 m/s: the arena corridors are ~0.42 m wide and the rover is 0.28 m,
      # so there is no room for overshoot. 0.26 m/s made the rover arrive at
      # gaps too hot, clip them and get wedged (gz then ejects it, which looks
      # like a teleport). Turning stays fast - that is what shrinks the radius.
      max_vel_x: 0.15
      max_vel_y: 0.0
      # Diff drive: a higher angular limit is what shrinks the turning radius
      # (radius = v/omega). At 0.26 m/s and 1.0 rad/s the robot needed 0.26 m
      # of space to turn, which does not fit a 0.5 m maze corner.
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 0.15
      min_speed_theta: 0.0
      acc_lim_x: 0.35
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -0.35
      decel_lim_y: 0.0
      decel_lim_theta: -1.5
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 30
      sim_time: 1.7
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      # FIX: was base_link
      robot_base_frame: base_footprint
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 3
      height: 3
      # 2.5 cm cells: a ~0.22 m free channel in a 0.5 m corridor is only ~4
      # cells wide at 5 cm, which is too coarse to turn inside.
      resolution: 0.025
      # Planner footprint = the measured metal, not a shrunken one.
      # True footprint from the meshes is a 0.271 x 0.236 m body with the wheels
      # out to y = +/-0.141, i.e. an inscribed radius of 0.136 m.
      #
      # An earlier revision planned with 0.115 m to buy channel in the narrow
      # corridors. Measured on the running stack, that is worse: the planner
      # happily produced paths through pinches the rover physically cannot pass,
      # the controller drove in until the collision monitor stopped it, and with
      # the way ahead fully lethal it could neither pivot nor back out - it sat
      # there with cmd_vel_nav at 0.116 m/s. A plan the rover cannot execute is
      # not a plan, so the footprint is now the real one (it may still scrape by
      # a wheel's width in a 0.30 m gap, but it no longer plans a 0.24 m one).
      footprint: "[ [0.128, 0.134], [0.128, -0.134], [-0.128, -0.134], [-0.128, 0.134] ]"
      transform_tolerance: 0.5
      # FIX: ObstacleLayer instead of VoxelLayer, since this is a 2D lidar
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          # obstacle_max_range must stay below the distance at which the lidar
          # sees the FLOOR. The lidar sits 0.1975 m up; the arena's plateau ramps
          # are 12.3% (7.0 deg), so a pitched robot hits the floor at
          # 0.1975 / tan(7.0) = 1.61 m. With 2.5 m that painted a phantom
          # obstacle wall ~1.6 m ahead (a ring in the open), sealing corridors
          # and making NavFn fail with "failed to create a plan from potential
          # when a legal potential was found".
          # 1.2 m leaves headroom up to a 9.3 deg pitch; real walls are still
          # marked close in, the static map owns the global plan, and the
          # collision_monitor watches the raw scan for actual collisions.
          obstacle_max_range: 1.2
          obstacle_min_range: 0.1
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Steep falloff = the robot is willing to pass close to walls. The hard
        # keep-out is still the footprint's inscribed radius; this only removes
        # the planner's reluctance, which was making it refuse tight doorways.
        cost_scaling_factor: 8.0
        # Must be >= the inscribed radius, otherwise there is no gradient at all.
        inflation_radius: 0.22
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 1.0
      publish_frequency: 1.0
      # Rolling window, 8 x 8 m. With a non-rolling costmap the static layer
      # sizes it to the *last* /map it received; in SLAM mode every frontier
      # goal sits on the edge of the new map, i.e. one cell outside the costmap,
      # and the planner rejected it instantly ("worldToMap failed: mx 25, size
      # 25") so the goal aborted 13 ms after being sent. A window larger than
      # the 6 x 3 m arena keeps every reachable goal inside it.
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      # Planner footprint - the measured metal; see local_costmap above.
      footprint: "[ [0.128, 0.134], [0.128, -0.134], [-0.128, -0.134], [-0.128, 0.134] ]"
      transform_tolerance: 0.5
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
        subscribe_to_updates: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          # Kept equal to the local costmap: floor returns from the plateau ramps
          # are phantom obstacles in the global plan too (see local_costmap).
          obstacle_max_range: 1.2
          obstacle_min_range: 0.1
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 8.0
        inflation_radius: 0.22
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    # The map is supplied at launch time by the 'map' launch argument
    # (navigate.launch.py / autonomous_maze.launch.py default to
    # maps/arena.yaml in this repository), which overrides yaml_filename.
    # Do not hard-code a user-specific absolute path here.

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      # FIX: '::' instead of '/'
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      # Must stay false: with allow_unknown true the planner happily routes
      # through unknown space and drives the robot off the mapped arena.
      allow_unknown: false

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    # FIX: '::' instead of '/'
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.2
    min_rotational_vel: 0.25
    rotational_acc_lim: 1.5

# FIX: the key names were wrong (acceleration/deceleration). Nav2 uses max_accel/max_decel.
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.15, 0.0, 1.2]
    min_velocity: [-0.15, 0.0, -1.2]
    max_accel: [0.35, 0.0, 1.5]
    max_decel: [-0.35, 0.0, -1.5]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false

# Chain: controller -> cmd_vel_nav -> velocity_smoother -> cmd_vel_smoothed
#        -> collision_monitor -> cmd_vel_safe
#        -> twist_mux (+ /cmd_vel_emergency, high priority) -> cmd_vel
#        -> Gazebo diff drive
collision_monitor:
  ros__parameters:
    use_sim_time: true
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    cmd_vel_in_topic: "cmd_vel_smoothed"
    cmd_vel_out_topic: "cmd_vel_safe"
    state_topic: "collision_monitor_state"
    enable_stamped_cmd_vel: false
    transform_tolerance: 0.5
    source_timeout: 5.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["FootprintApproach"]
    FootprintApproach:
      type: "polygon"
      action_type: "approach"
      # NOT footprint_topic: that would follow the shrunken planner footprint
      # above and quietly make the emergency stop optimistic. This is the true
      # footprint (base_link 0.271 x 0.236 m, wheels to +/-0.141) plus ~5 mm,
      # so the last-resort guard still believes the rover is as wide as it is.
      points: "[ [0.145, 0.150], [0.145, -0.150], [-0.145, -0.150], [-0.145, 0.150] ]"
      # Was 1.2 s: at 0.26 m/s that projects the footprint 0.31 m ahead, so in a
      # ~0.5 m doorway the walls register as a collision and the monitor stops
      # the robot exactly where it needs to commit and drive through.
      time_before_collision: 0.5
      simulation_time_step: 0.05
      min_points: 6
      visualize: false
      enabled: true
    observation_sources: ["scan"]
    scan:
      type: "scan"
      topic: "/scan"
      min_height: 0.0
      max_height: 2.0
      enabled: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# Not used for maze navigation, but navigation_launch.py always starts this node,
# so it needs a valid config to avoid aborting lifecycle bringup.
docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "base_footprint"
    fixed_frame: "odom"
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    enable_stamped_cmd_vel: false
    dock_plugins: ["simple_charging_dock"]
    simple_charging_dock:
      plugin: "opennav_docking::SimpleChargingDock"
      docking_threshold: 0.05
      staging_x_offset: -0.7
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.18
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: -1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.1
    controller:
      k_phi: 3.0
      k_delta: 2.0
      v_linear_min: 0.15
      v_linear_max: 0.15
      use_collision_detection: true
      costmap_topic: "local_costmap/costmap_raw"
      footprint_topic: "local_costmap/published_footprint"
      transform_tolerance: 0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.3
