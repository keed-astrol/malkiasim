slam_toolbox:
  ros__parameters:
    use_sim_time: true

    # Solver (online_async: best for exploration / teleop-driven SLAM)
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS params
    base_frame: base_footprint
    odom_frame: odom
    map_frame: map
    scan_topic: /scan
    mode: mapping
    debug_logging: false
    throttle_scans: 1
    enable_interactive_mode: true

    # Map
    resolution: 0.05
    map_update_interval: 1.0
    transform_publish_period: 0.02

    # Laser params
    min_laser_range: 0.15          # lidar min is 0.1; drop the closest returns
    max_laser_range: 8.0          # long grazing-angle hits cause speckle
    minimum_time_interval: 0.2     # process at most 5 scans/s (lidar is 15 Hz)
    # slam_toolbox subscribes through a tf2 MessageFilter that queues scans until
    # the odom -> lidar_link transform for their stamp exists. The defaults
    # (scan_queue_size 1, transform_timeout 0.2) are too tight when the EKF is
    # still catching up with a 15 Hz scan stream, so give the filter some slack.
    scan_queue_size: 5
    transform_timeout: 0.5
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true
    # A parked rover must still build a map. shouldProcessScan() only adds a
    # scan after the robot has travelled 0.8 * minimum_travel_distance; the
    # single "first measurement" pass does not reach the published grid (a
    # parked rover's /map stays 0x0 even after a minute of scans). An empty
    # /map is rejected by Nav2 as malformed and leaves EXPLORE with no
    # frontiers, so accept scans on the time interval instead of on travel.
    minimum_travel_distance: 0.0
    minimum_travel_heading: 0.1
    scan_buffer_size: 1000
    scan_buffer_maximum_scan_distance: 10.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5

    # Loop closure
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.30
    loop_match_minimum_response_fine: 0.40
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Correlation params
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Scan matcher penalties
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
