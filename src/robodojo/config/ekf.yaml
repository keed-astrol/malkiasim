ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true               # keeps the filter output planar for slam_toolbox
    transform_time_offset: 0.0
    transform_timeout: 0.2
    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel odometry: forward speed ONLY.
    # Wheel yaw rate is dropped because skid-steer wheel slip corrupts it,
    # especially on the ramp. The IMU owns heading.
    odom0: /odom
    odom0_config: [false, false, false,    # x, y, z
                   false, false, false,    # roll, pitch, yaw
                   true,  false, false,    # vx, vy, vz
                   false, false, false,    # vroll, vpitch, vyaw
                   false, false, false]    # ax, ay, az
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU: absolute yaw + yaw rate.
    imu0: /imu
    imu0_config: [false, false, false,     # x, y, z
                  false, false, true,      # roll, pitch, YAW (absolute)
                  false, false, false,     # vx, vy, vz
                  false, false, true,      # vroll, vpitch, VYAW
                  false, false, false]     # ax, ay, az
    imu0_differential: false
    imu0_relative: true                # set true if the robot spawns with non-zero yaw
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 20