# ─── Custom BT + mission params for RoboDojo autonomous maze navigation ───

# Override bt_navigator to use our custom behavior tree
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.2
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Custom behavior tree XML — loaded from dojo_bt package share
    default_bt_xml_filename: "$(find-pkg-share dojo_bt)/behavior_trees/maze/autonomous_maze.xml"
    plugin_lib_names:
      - "dojo_bt_plugins"

# ─── Mission parameters (default values for the BT blackboard) ───
mission_params:
  ros__parameters:
    backup_dist: 0.3
    backup_speed: 0.15
    spin_dist: 3.14159
    collision_min_range: 0.25
    collision_warn_range: 0.50
    stuck_threshold_sec: 5.0
    explore_waypoint_count: 5
    frontier_min_dist: 0.5
    max_recovery_attempts: 3

# ─── Extended behavior server config (adds custom behaviors) ───
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0
