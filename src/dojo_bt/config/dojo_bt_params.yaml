# ─── Custom BT + mission params for RoboDojo autonomous maze navigation ───

# Override bt_navigator to use our custom behavior tree
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.2
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # Custom behavior tree XML — loaded from dojo_bt package share.
    # (default_bt_xml_filename was renamed in Nav2 Galactic; the old name is
    # silently ignored on Jazzy, so the custom tree never loaded.)
    default_nav_to_pose_bt_xml: "$(find-pkg-share dojo_bt)/behavior_trees/maze/autonomous_maze.xml"
    # NavigateThroughPoses uses Nav2's stock tree: our custom tree is written
    # for NavigateToPose and reads {goal}, which the through-poses action does
    # not set. Pointing both at it made every waypoint run plan to an empty
    # frame ("Failed to transform from  to map", goal (0,0)) and abort.
    default_nav_through_poses_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    plugin_lib_names:
      - "dojo_bt_plugins"

# ─── Extended behavior server config (adds custom behaviors) ───
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    enable_stamped_cmd_vel: false
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0
